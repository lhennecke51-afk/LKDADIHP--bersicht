<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Feuerwehren DADI · DA · HP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0160c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feuerwehren">
<style>
:root{--bg:#f6f4f2;--sf:#fff;--tx:#1d1b1a;--mu:#6b6560;--bd:#e4dfdb;--ac:#c0160c;--ac2:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141211;--sf:#201d1c;--tx:#f2eeeb;--mu:#a39b95;--bd:#34302e;--ac:#ef5148;--ac2:#3a1c1a}}
:root[data-theme="dark"]{--bg:#141211;--sf:#201d1c;--tx:#f2eeeb;--mu:#a39b95;--bd:#34302e;--ac:#ef5148;--ac2:#3a1c1a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sos{background:var(--ac);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px}
input[type=search],input[type=text]{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font-size:16px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:4px 14px 90px}
.cnt{color:var(--mu);font-size:13px;margin:6px 2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.nm{flex:1;font-weight:600}
.sub{color:var(--mu);font-size:13px}
.tag{font-size:11px;font-weight:700;background:var(--ac2);color:var(--ac);padding:2px 7px;border-radius:6px}
.star{background:none;border:0;font-size:22px;color:var(--mu);padding:4px}
.star.on{color:#e8a200}
.act{display:flex;gap:8px;margin-top:10px}
.act a,.act button{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-decoration:none;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:16px;background:var(--sf);color:var(--tx);width:min(92vw,400px);padding:18px}
dialog::backdrop{background:#0007}
dialog label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.btns .p{background:var(--ac);border-color:var(--ac);color:#fff}
.veh{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}.vh{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;margin:6px 0 4px}.vr{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}.vr .vt{flex:1}.vr small{display:block;color:var(--mu)}.st{border:0;border-radius:6px;font-size:11px;font-weight:700;padding:4px 8px;background:#dff3e3;color:#17612b}.st.off{background:#eee;color:#666}.vx{border:0;background:none;color:var(--mu);font-size:16px}.vadd{width:100%;margin-top:6px;padding:8px;border:1px dashed var(--bd);border-radius:10px;background:none;color:var(--ac);font-size:14px}.tools{text-align:center;margin-top:18px}.tools button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;margin:2px}.empty{text-align:center;color:var(--mu);padding:40px 0}
.inst{display:none;margin:8px 0;font-size:13px;background:var(--ac2);color:var(--tx);padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<header>
  <h1>🚒 Feuerwehren <a class="sos" href="tel:112">Notruf 112</a></h1>
  <input type="search" id="q" placeholder="Ort oder Wehr suchen …" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="inst" id="inst">Als App installieren: Teilen-Menü → „Zum Home-Bildschirm“ <button id="x" style="float:right;border:0;background:none;color:inherit">✕</button></div>
</header>
<main><div class="cnt" id="cnt"></div><div id="list"></div><div class="tools"><button id="exp">Fahrzeugdaten exportieren</button><button id="imp">Fahrzeugdaten importieren</button></div></main>
<button class="fab" id="add">＋ Wehr</button>

<dialog id="dlg">
  <b>Feuerwehr hinzufügen</b>
  <label>Name / Ortsteil</label><input type="text" id="n" placeholder="z. B. Freiwillige Feuerwehr Wixhausen">
  <label>Kreis</label>
  <select id="k"><option value="DADI">Darmstadt-Dieburg (DADI)</option><option value="DA">Darmstadt (DA)</option><option value="HP">Kreis Bergstraße (HP)</option></select>
  <label>Telefon (optional)</label><input type="text" id="t" inputmode="tel">
  <div class="btns"><button id="c">Abbrechen</button><button class="p" id="s">Speichern</button></div>
</dialog>

<script>
const KREISE={ALL:'Alle',FAV:'★ Favoriten',DADI:'Darmstadt-Dieburg',DA:'Darmstadt',HP:'Bergstraße'};
const FF='Freiwillige Feuerwehr ';
const base=[];
const add=(k,names,pre=FF)=>names.forEach(n=>base.push({id:k+'-'+n,n:pre+n,k,o:n}));
add('DADI',['Alsbach-Hähnlein','Babenhausen','Bickenbach','Dieburg','Eppertshausen','Erzhausen','Fischbachtal','Griesheim','Groß-Bieberau','Groß-Umstadt','Groß-Zimmern','Messel','Modautal','Mühltal','Münster','Ober-Ramstadt','Otzberg','Pfungstadt','Reinheim','Roßdorf','Schaafheim','Seeheim-Jugenheim','Weiterstadt']);
base.push({id:'DA-BF',n:'Berufsfeuerwehr Darmstadt',k:'DA',o:'Darmstadt'});
add('DA',['Arheilgen','Bessungen','Eberstadt','Kranichstein','Wixhausen'],FF+'Darmstadt-');
add('HP',['Abtsteinach','Biblis','Bensheim','Birkenau','Bürstadt','Einhausen','Fürth','Gorxheimertal','Grasellenbach','Groß-Rohrheim','Heppenheim','Hirschhorn','Lampertheim','Lautertal','Lindenfels','Lorsch','Mörlenbach','Neckarsteinach','Rimbach','Viernheim','Wald-Michelbach','Zwingenberg']);

const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=ls.get('fav',[]),custom=ls.get('custom',[]),filter='ALL',open=null;
const $=id=>document.getElementById(id);
const all=()=>[...base,...custom].sort((a,b)=>a.n.localeCompare(b.n,'de'));

$('chips').innerHTML=Object.entries(KREISE).map(([k,v])=>`<button class="chip" data-k="${k}">${v}</button>`).join('');
$('chips').onclick=e=>{const k=e.target.dataset.k;if(k){filter=k;render()}};
$('q').oninput=render;

function render(){
  const q=$('q').value.trim().toLowerCase();
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===filter));
  const items=all().filter(f=>(filter==='ALL'||(filter==='FAV'?favs.includes(f.id):f.k===filter))&&(!q||f.n.toLowerCase().includes(q)));
  $('cnt').textContent=items.length+' Einträge';
  $('list').innerHTML=items.length?items.map(f=>{
    const star=favs.includes(f.id),isOpen=open===f.id;
    const mq=encodeURIComponent(f.n+' '+(f.o||''));
    return `<div class="card"><div class="row" data-o="${f.id}"><div class="nm">${esc(f.n)}<div class="sub">${KREISE[f.k]}${f.c?' · eigener Eintrag':''}${vs(f).length?' · '+vs(f).length+' Fzg.':''}</div></div><span class="tag">${f.k}</span><button class="star ${star?'on':''}" data-f="${f.id}" aria-label="Favorit">${star?'★':'☆'}</button></div>${isOpen?vehHtml(f)+`<div class="act"><a href="https://www.google.com/maps/search/?api=1&query=${mq}" target="_blank" rel="noopener">📍 Karte</a>${f.t?`<a href="tel:${esc(f.t)}">📞 Anrufen</a>`:''}${f.c?`<button data-d="${f.id}">🗑 Löschen</button>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">Nichts gefunden.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('list').onclick=e=>{
  const f=e.target.closest('[data-f]'),d=e.target.closest('[data-d]'),o=e.target.closest('[data-o]');
  const va=e.target.closest('[data-va]'),vt=e.target.closest('[data-vt]'),vd=e.target.closest('[data-vd]');
  if(va||vt||vd){vehClick(va,vt,vd);render();return}
  if(f){const id=f.dataset.f;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];ls.set('fav',favs)}
  else if(d){custom=custom.filter(x=>x.id!==d.dataset.d);ls.set('custom',custom)}
  else if(o){open=open===o.dataset.o?null:o.dataset.o}
  else return;
  render();
};
$('add').onclick=()=>$('dlg').showModal();
$('c').onclick=()=>$('dlg').close();
$('s').onclick=()=>{
  const n=$('n').value.trim();if(!n)return;
  custom.push({id:'c-'+Date.now(),n,k:$('k').value,t:$('t').value.trim(),c:1,o:''});
  ls.set('custom',custom);$('n').value=$('t').value='';$('dlg').close();render();
};

// Fahrzeuge: {stationId:[{id,r:Funkrufname,t:Typ,s:1|0}]}
let veh=ls.get('veh',{});
function vs(f){return veh[f.id]||[]}
function vehHtml(f){
  const v=vs(f);
  const grp=(s,h)=>{const a=v.filter(x=>x.s===s);return a.length?`<div class="vh">${h} (${a.length})</div>`+a.map(x=>`<div class="vr"><div class="vt"><b>${esc(x.t)}</b><small>${esc(x.r||'–')}</small></div><button class="st ${s?'':'off'}" data-vt="${f.id}|${x.id}">${s?'In Dienst':'Außer Dienst'}</button><button class="vx" data-vd="${f.id}|${x.id}" aria-label="Löschen">✕</button></div>`).join(''):''};
  return `<div class="veh">${v.length?grp(1,'In Dienst')+grp(0,'Außer Dienst'):'<div class="sub">Noch keine Fahrzeuge erfasst.</div>'}<button class="vadd" data-va="${f.id}">＋ Fahrzeug</button></div>`;
}
function vehClick(va,vt,vd){
  if(va){
    const t=prompt('Fahrzeugtyp (z. B. HLF 20, DLK 23, MTW):');if(!t)return;
    const r=prompt('Funkrufname (z. B. Florian Griesheim 1-46-1):','')||'';
    const s=confirm('Fahrzeug ist aktuell in Dienst?\nOK = In Dienst, Abbrechen = Außer Dienst')?1:0;
    (veh[va.dataset.va]=veh[va.dataset.va]||[]).push({id:'v'+Date.now(),t:t.trim(),r:r.trim(),s});
  }else if(vt){
    const [sid,vid]=vt.dataset.vt.split('|');const x=veh[sid].find(y=>y.id===vid);if(x)x.s=x.s?0:1;
  }else if(vd){
    const [sid,vid]=vd.dataset.vd.split('|');if(!confirm('Fahrzeug löschen?'))return;veh[sid]=veh[sid].filter(y=>y.id!==vid);
  }
  ls.set('veh',veh);
}
$('exp').onclick=async()=>{const j=JSON.stringify(veh);try{await navigator.clipboard.writeText(j);alert('Fahrzeugdaten in die Zwischenablage kopiert.')}catch(e){prompt('Zum Kopieren:',j)}};
$('imp').onclick=()=>{const j=prompt('Exportierte Fahrzeugdaten (JSON) einfügen:');if(!j)return;try{const o=JSON.parse(j);if(typeof o!=='object'||Array.isArray(o))throw 0;let n=0,u=0;for(const sid in o){if(!Array.isArray(o[sid]))continue;const cur=veh[sid]=veh[sid]||[];for(const x of o[sid]){if(!x||!x.id||!x.t)continue;const e=cur.find(y=>y.id===x.id);if(e){if(e.s!==x.s||e.r!==x.r||e.t!==x.t){Object.assign(e,{t:x.t,r:x.r||'',s:x.s?1:0});u++}}else{cur.push({id:x.id,t:x.t,r:x.r||'',s:x.s?1:0});n++}}}ls.set('veh',veh);render();alert(n+' neu, '+u+' aktualisiert.')}catch(e){alert('Ungültige Daten.')}};

// PWA: Manifest zur Laufzeit erzeugen
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&/iphone|ipad/i.test(navigator.userAgent)&&!ls.get('hideInst',false))$('inst').style.display='block';
$('x').onclick=()=>{$('inst').style.display='none';ls.set('hideInst',true)};
render();
</script>
</body>
</html>
